name: Setup
description: Install the requested mise tools and bun dependencies.
inputs:
  install_args:
    description: Space-separated mise tools to install.
    required: false
    default: "bun node"
runs:
  using: composite
  steps:
    - name: Install Mise tools
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        version: 2026.10.6
        install_args: ${{ inputs.install_args }}

    - name: Install Dependencies
      shell: bash
      run: bun install --frozen-lockfile
