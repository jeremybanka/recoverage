name: Setup
description: Install the requested mise tools and bun dependencies.
inputs:
  install_args:
    description: Space-separated mise tools to install.
    required: false
    default: "bun node"
runs:
  using: composite
  steps:
    - name: Install Mise tools
      uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      with:
        version: 2026.10.25
        install_args: ${{ inputs.install_args }}

    - name: Install Dependencies
      shell: bash
      run: bun install --frozen-lockfile
