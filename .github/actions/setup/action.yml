name: Setup
description: Install the requested mise tools and pnpm dependencies.
inputs:
  install_args:
    description: Space-separated mise tools to install.
    required: false
    default: "bun node pnpm"
runs:
  using: composite
  steps:
    - name: Install Mise tools
      uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      with:
        version: 2026.10.17
        install_args: ${{ inputs.install_args }}

    - name: Install Dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
