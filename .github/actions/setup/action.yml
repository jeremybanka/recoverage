name: Setup
description: Install the requested mise tools and bun dependencies.
inputs:
  install_args:
    description: Space-separated mise tools to install.
    required: false
    default: "bun node"
runs:
  using: composite
  steps:
    - name: Install Mise tools
      uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      with:
        version: 2026.10.15
        install_args: ${{ inputs.install_args }}

    - name: Install Dependencies
      shell: bash
      run: bun install --frozen-lockfile
