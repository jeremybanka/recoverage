name: Setup
description: Install the requested mise tools and bun dependencies.
inputs:
  install_args:
    description: Space-separated mise tools to install.
    required: false
    default: "bun node"
runs:
  using: composite
  steps:
    - name: Install Mise tools
      uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      with:
        version: 2026.9.18
        install_args: ${{ inputs.install_args }}

    - name: Install Dependencies
      shell: bash
      run: bun install --frozen-lockfile
