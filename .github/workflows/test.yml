name: Test

permissions:
  contents: read

on:
  push:
    branches: ["main", "paid-coverage-tiers"]
  # Keep PR targets unrestricted so work targeting integration branches is checked.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

defaults:
  run:
    shell: bash

jobs:
  Vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-test-git
      - run: pnpm run test
      - run: pnpm run test:tooling

  Build:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run build

  Recoverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Comparisons need no secrets; only pushes to main publish the live badge.
    env:
      TURBO_TOKEN: ""
      TURBO_TEAM: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-test-git
      - run: pnpm run cov
      - name: Compare each package with the PR target commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun packages/recoverage/__scripts__/coverage-check.bun.ts "$BASE_SHA"
      - name: Publish package coverage for the live badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: packages/recoverage
        env:
          RECOVERAGE_CLOUD_TOKEN: ${{ secrets.RECOVERAGE_CLOUD_TOKEN }}
        run: |
          : "${RECOVERAGE_CLOUD_TOKEN:?Set the RECOVERAGE_CLOUD_TOKEN repository secret to publish the coverage badge}"
          bun bin/recoverage.bin.js capture

  Breakage:
    name: Breakage
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/setup-test-git
      - run: pnpm run test:breakage
